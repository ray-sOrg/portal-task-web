name: 🛠️ Build Docker Image

# ========================================
# 触发条件：
# - main 分支推送 → latest 标签
# - develop 分支推送 → develop 标签  
# - tag 推送 (v*) → 对应版本标签
# ========================================
on:
  push:
    branches: [main, develop]
    tags: ['v*']

env:
  PROJECT_NAME: portal-task-web
  ACR_REGISTRY_VPC: registry-vpc.cn-chengdu.aliyuncs.com
  ACR_REGISTRY_PUBLIC: registry.cn-chengdu.aliyuncs.com
  ACR_NAMESPACE: ray321

jobs:
  build:
    name: 🛠️ Build & Push Docker Image
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY || '' }}

      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: |
            **/node_modules
            ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}

      - name: Login to Alibaba Cloud ACR (VPC)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY_VPC }}
          username: ${{ secrets.ALICLOUD_USERNAME }}
          password: ${{ secrets.ALICLOUD_PASSWORD }}

      # 根据分支/tag 生成镜像标签
      - name: Generate image tag
        id: meta
        run: |
          VPC_IMAGE=${{ env.ACR_REGISTRY_VPC }}/${{ env.ACR_NAMESPACE }}/${{ env.PROJECT_NAME }}
          PUBLIC_IMAGE=${{ env.ACR_REGISTRY_PUBLIC }}/${{ env.ACR_NAMESPACE }}/${{ env.PROJECT_NAME }}
          
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            IMAGE_TAG=${GITHUB_REF#refs/tags/v}
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            IMAGE_TAG=latest
          elif [[ "$GITHUB_REF" == refs/heads/develop ]]; then
            IMAGE_TAG=develop
          else
            IMAGE_TAG=${GITHUB_REF#refs/heads/}
          fi
          
          echo "vpc_image=$VPC_IMAGE" >> $GITHUB_OUTPUT
          echo "public_image=$PUBLIC_IMAGE" >> $GITHUB_OUTPUT
          echo "tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "🏷️ 镜像: $PUBLIC_IMAGE:$IMAGE_TAG"

      - name: Build & Push Docker Image
        run: |
          VPC_IMAGE=${{ steps.meta.outputs.vpc_image }}
          PUBLIC_IMAGE=${{ steps.meta.outputs.public_image }}
          IMAGE_TAG=${{ steps.meta.outputs.tag }}

          docker build \
            --build-arg DATABASE_URL=${{ secrets.SUPABASE_POSTGRES_DATABASE_URL }} \
            --build-arg DIRECT_URL=${{ secrets.SUPABASE_POSTGRES_DIRECT_URL }} \
            -t $VPC_IMAGE:$IMAGE_TAG .

          docker push $VPC_IMAGE:$IMAGE_TAG
          echo "✅ 镜像推送成功: $PUBLIC_IMAGE:$IMAGE_TAG"

      - name: Clean Docker BuildKit cache
        run: docker builder prune -af

      - name: Summary
        run: |
          echo "✅ 镜像构建完成"
          echo "📦 ${{ steps.meta.outputs.public_image }}:${{ steps.meta.outputs.tag }}"
          echo ""
          echo "在 Kuboard 中手动更新镜像版本即可部署"
