# ========================================
# 🔧 项目配置说明（复用到其他项目时需要修改）
# ========================================
# 需要修改的地方：
# 1. 所有 "portal-task-web" 改为你的项目名称
# 2. secret name: supabase-secret-portal-task-web 改为 supabase-secret-{项目名}
# 3. Ingress host: task.tt829.cn 改为你的域名
# 4. Ingress secretName: portal-task-web-tls 改为 {项目名}-tls
# 5. containerPort 和 targetPort: 根据你的项目端口修改
# 6. 健康检查路径: /api/health 改为你的项目健康检查路径
# ========================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-task-web-deployment
  labels:
    app: portal-task-web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: portal-task-web
  template:
    metadata:
      labels:
        app: portal-task-web
    spec:
      imagePullSecrets:
        - name: tencent-tcr-secret
      containers:
        - name: portal-task-web
          image: __IMAGE_NAME__:__IMAGE_TAG__
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: supabase-secret-portal-task-web
                  key: DATABASE_URL
            - name: DIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: supabase-secret-portal-task-web
                  key: DIRECT_URL
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: portal-task-web-service
spec:
  selector:
    app: portal-task-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portal-task-web-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - task.tt829.cn
      secretName: portal-task-web-tls
  rules:
    - host: task.tt829.cn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portal-task-web-service
                port:
                  number: 80
